

<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kelime Yarışması</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:linear-gradient(135deg,#10152d,#202c52);
 color:white;
 text-align:center;
 padding:25px;
}
.container{
 max-width:650px;
 margin:30px auto;
 background:#202943;
 padding:25px;
 border-radius:20px;
 box-shadow:0 10px 35px #0007;
}
h1{color:#ffd43b}
h2{color:#65d6ff}
input{
 width:90%;
 padding:14px;
 border:0;
 border-radius:10px;
 margin:12px;
 font-size:17px;
}
button{
 padding:13px 22px;
 margin:7px;
 border:0;
 border-radius:10px;
 background:#ffd43b;
 color:#171717;
 font-weight:bold;
 font-size:16px;
 cursor:pointer;
}
button:hover{background:#ffb700}
.hidden{display:none}
.info{
 background:#111a30;
 padding:13px;
 border-radius:12px;
 margin:12px 0;
}
#question{font-size:23px;margin:25px 0}
#timer{font-size:28px;color:#ffd43b}
#feedback{min-height:25px;font-weight:bold}
li{
 list-style:none;
 background:#111a30;
 padding:12px;
 margin:8px;
 border-radius:9px;
}
</style>
</head>
<body>

<div class="container">
<h1>🏆 KELİME YARIŞMASI</h1>

<div id="start">
<h2>Yarışmayı Başlat</h2>
<p>İlk grubun adını gir:</p>
<input id="groupName" placeholder="Örn: Şampiyonlar">
<br>
<button onclick="startGroup()">Yarışmayı Başlat</button>
</div>

<div id="game" class="hidden">
<h2 id="currentGroup"></h2>
<div class="info">
 Tur: <span id="round">1</span> / 3
 <br>
 Puan: <span id="score">0</span>
 <br>
 Soru: <span id="questionNumber">1</span> / 3
</div>

<div id="timer">60</div>
<div id="question"></div>

<input id="answer" placeholder="Cevabını yaz..." autocomplete="off">
<br>
<button onclick="checkAnswer()">Cevapla</button>
<button onclick="skipQuestion()">Pas Geç</button>

<p id="feedback"></p>
</div>

<div id="result" class="hidden">
<h2>🎉 Grup Yarışmayı Bitirdi!</h2>
<h3 id="finishedName"></h3>
<h2 id="finishedScore"></h2>
<button onclick="newGroup()">➕ Yeni Grup</button>
<button onclick="showRanking()">🏆 Sıralamayı Gör</button>
</div>

<div id="ranking" class="hidden">
<h2>🏆 GRUP SIRALAMASI</h2>
<ol id="rankingList"></ol>
<button onclick="newGroup()">Yeni Grup Ekle</button>
</div>

</div>

<script>
// SORULARI BURADAN DEĞİŞTİREBİLİRSİN
const questions = [
[
 {q:"Özgür kelimesinin eş anlamlısı nedir?",a:["hür","serbest"]},
 {q:"Cesur kelimesinin zıt anlamlısı nedir?",a:["korkak","ürkek"]},
 {q:"Mutlu kelimesinin zıt anlamlısı nedir?",a:["üzgün","mutsuz"]}
],
[
 {q:"Hızlı kelimesinin zıt anlamlısı nedir?",a:["yavaş"]},
 {q:"Misafir kelimesinin eş anlamlısı nedir?",a:["konuk"]},
 {q:"Cömert kelimesinin zıt anlamlısı nedir?",a:["cimri","pinti"]}
],
[
 {q:"Uzak kelimesinin zıt anlamlısı nedir?",a:["yakın"]},
 {q:"Yanıt kelimesinin eş anlamlısı nedir?",a:["cevap"]},
 {q:"İhtiyar kelimesinin eş anlamlısı nedir?",a:["yaşlı"]}
]
];

let groups=[];
let currentGroup=null;
let round=0;
let questionIndex=0;
let score=0;
let time=60;
let timerInterval=null;
let locked=false;

function startGroup(){
 const name=document.getElementById("groupName").value.trim();

 if(!name){
  alert("Lütfen grup adını gir!");
  return;
 }

 if(groups.some(g=>g.name.toLowerCase()===name.toLowerCase())){
  alert("Bu grup adı zaten kullanılmış!");
  return;
 }

 currentGroup={name:name,score:0};
 round=0;
 questionIndex=0;
 score=0;

 document.getElementById("start").classList.add("hidden");
 document.getElementById("result").classList.add("hidden");
 document.getElementById("ranking").classList.add("hidden");
 document.getElementById("game").classList.remove("hidden");

 showQuestion();
}

function showQuestion(){
 clearInterval(timerInterval);

 if(round>=3){
  finishGroup();
  return;
 }

 if(questionIndex>=3){
  round++;
  questionIndex=0;
  if(round>=3){
   finishGroup();
   return;
  }
 }

 locked=false;
 time=60;

 document.getElementById("currentGroup").textContent=
 "🎯 "+currentGroup.name;

 document.getElementById("round").textContent=round+1;
 document.getElementById("score").textContent=score;
 document.getElementById("questionNumber").textContent=questionIndex+1;

 document.getElementById("question").textContent=
 questions[round][questionIndex].q;

 document.getElementById("answer").value="";
 document.getElementById("feedback").textContent="";
 document.getElementById("timer").textContent=time;

 document.getElementById("answer").focus();

 timerInterval=setInterval(()=>{
  time--;
  document.getElementById("timer").textContent=time;

  if(time<=0){
   clearInterval(timerInterval);
   nextQuestion("Süre doldu!");
  }
 },1000);
}

function checkAnswer(){
 if(locked)return;

 const answer=document.getElementById("answer").value
 .trim().toLocaleLowerCase("tr-TR");

 if(!answer){
  alert("Önce cevap yaz!");
  return;
 }

 const correctAnswers=questions[round][questionIndex].a;

 if(correctAnswers.some(a=>a.toLocaleLowerCase("tr-TR")===answer)){
  score+=10;
  document.getElementById("feedback").textContent="✅ DOĞRU! +10 PUAN";
  document.getElementById("feedback").style.color="#58ed8a";
 }else{
  document.getElementById("feedback").textContent="❌ Yanlış cevap! 0 puan.";
  document.getElementById("feedback").style.color="#ff7777";
 }

 document.getElementById("score").textContent=score;
 nextQuestionAfterDelay();
}

function skipQuestion(){
 if(locked)return;
 document.getElementById("feedback").textContent="⏭ Pas geçildi. 0 puan.";
 nextQuestionAfterDelay();
}

function nextQuestionAfterDelay(){
 locked=true;
 clearInterval(timerInterval);
 setTimeout(()=>{
  questionIndex++;
  showQuestion();
 },900);
}

function nextQuestion(message){
 if(locked)return;
 locked=true;
 document.getElementById("feedback").textContent=message;
 setTimeout(()=>{
  questionIndex++;
  showQuestion();
 },900);
}

function finishGroup(){
 clearInterval(timerInterval);

 currentGroup.score=score;
 groups.push(currentGroup);

 document.getElementById("game").classList.add("hidden");
 document.getElementById("result").classList.remove("hidden");

 document.getElementById("finishedName").textContent=currentGroup.name;
 document.getElementById("finishedScore").textContent=score+" PUAN";
}

function newGroup(){
 document.getElementById("result").classList.add("hidden");
 document.getElementById("ranking").classList.add("hidden");
 document.getElementById("start").classList.remove("hidden");
 document.getElementById("groupName").value="";
 document.getElementById("groupName").focus();
}

function showRanking(){
 document.getElementById("result").classList.add("hidden");
 document.getElementById("ranking").classList.remove("hidden");

 const sorted=[...groups].sort((a,b)=>b.score-a.score);
 const list=document.getElementById("rankingList");
 list.innerHTML="";

 sorted.forEach((g,i)=>{
  const li=document.createElement("li");
  li.textContent=(i===0?"🥇 ":i===1?"🥈 ":i===2?"🥉 ":"🏅 ")
   +(i+1)+". "+g.name+" — "+g.score+" puan";
  list.appendChild(li);
 });
}
</script>

</body>
</html>
