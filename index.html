
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>İpucu Savaşı</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;padding:18px;min-height:100vh;
 background:linear-gradient(135deg,#10152f,#34205e);
 color:white;font-family:Arial;text-align:center
}
.container{
 max-width:720px;margin:20px auto;background:#20264b;
 padding:24px;border-radius:22px;box-shadow:0 10px 35px #0006
}
h1{color:#ffd43b;font-size:38px}
h2{color:#8be9fd}
input{
 width:100%;padding:15px;border:0;border-radius:10px;
 font-size:18px;margin:12px 0
}
button{
 padding:14px 18px;border:0;border-radius:10px;
 font-weight:bold;font-size:16px;margin:6px;cursor:pointer
}
button:hover{filter:brightness(1.12)}
.yellow{background:#ffd43b;color:#171717}
.green{background:#16a36a;color:white}
.red{background:#d94355;color:white}
.gray{background:#6875a5;color:white}
.hidden{display:none!important}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}
.stat{background:#343c70;padding:14px;border-radius:12px;flex:1;min-width:100px}
.word{font-size:42px;color:#ffd43b;font-weight:bold;margin:28px 0}
#message{min-height:28px;color:#8be9fd}
table{width:100%;border-collapse:collapse;margin-top:20px}
td,th{padding:12px;border-bottom:1px solid #555}
th{color:#ffd43b}
.small{color:#bbb;font-size:14px}
</style>
</head>
<body>
<div class="container">

<section id="setup">
<h1>⚡ İPUCU SAVAŞI ⚡</h1>
<h2>Kelime Tahmin Yarışması</h2>
<p>Yarışacak grubun adını yaz:</p>
<input id="teamName" placeholder="Örnek: Şampiyonlar">
<button class="yellow" onclick="startFirstGroup()">YARIŞMAYA BAŞLA</button>
<p class="small">Her grup sırayla yarışır. Toplam 3 tur vardır.</p>
</section>

<section id="game" class="hidden">
<h2 id="team"></h2>
<h2 id="round"></h2>
<div class="stats">
 <div class="stat">❤️ Can<br><b id="lives">3</b></div>
 <div class="stat">⭐ Tur puanı<br><b id="score">0</b></div>
 <div class="stat">🏆 Toplam puan<br><b id="total">0</b></div>
 <div class="stat">⏱️ Süre<br><b id="time">60</b></div>
</div>
<p>Anlatıcı kelimeyi anlatsın, tahminci bulsun!</p>
<div class="word" id="word"></div>
<p>Kelimenin kendisini söylemek yasak!</p>
<button class="green" onclick="correct()">DOĞRU ✓</button>
<button class="red" onclick="wrong()">YANLIŞ ✕</button>
<button class="gray" onclick="passWord()">PAS GEÇ</button>
<p id="message"></p>
</section>

<section id="result" class="hidden">
<h1 id="resultTitle">TUR TAMAMLANDI</h1>
<h2 id="resultScore"></h2>
<p id="resultInfo"></p>
<button id="nextGroup" class="yellow" onclick="nextGroup()">YENİ GRUP</button>
<button id="finishStage" class="green" onclick="finishStage()">TURU TAMAMLA</button>
</section>

<section id="final" class="hidden">
<h1>🏆 YARIŞMA SONUÇLARI</h1>
<h2 id="champion"></h2>
<div id="ranking"></div>
<button class="yellow" onclick="location.reload()">YENİ YARIŞMA</button>
</section>

</div>

<script>
const wordPool=[
"Bilgisayar","Telefon","Araba","Bisiklet","Okul",
"Öğretmen","Futbol","Basketbol","Kalem","Kitap",
"Uçak","Deniz","Güneş","Ay","Kedi","Köpek",
"Pizza","Hamburger","Dondurma","Saat","Televizyon",
"Robot","Müzik","Yağmur","Şemsiye","Gözlük",
"Ayakkabı","Çikolata","Tren","Otobüs","Uçurtma",
"Çanta","Kamera","Bahçe","Doktor","Hastane",
"Orman","Balık","Elma","Masa","Sandalye",
"Kütüphane","Sinema","Bulut","Yıldız","Denizaltı",
"Bisikletçi","Telefon","Pencere","Kapı","Ayna"
];

const points=[10,20,30];
let groups=[];
let roundNo=1;
let activeGroups=[];
let groupIndex=0;
let currentGroup=null;
let roundScore=0;
let time=60;
let timer=null;
let cards=[];
let cardIndex=0;
let passed=[];
let passedLife=new Set();
let used=new Set();

function show(id){
 ["setup","game","result","final"].forEach(x=>
 document.getElementById(x).classList.add("hidden"));
 document.getElementById(id).classList.remove("hidden");
}

function startFirstGroup(){
 const name=document.getElementById("teamName").value.trim();
 if(!name){alert("Grup adını yaz!");return;}
 groups.push({name,score:0,lives:3,eliminated:false,rounds:[]});
 activeGroups=[...groups];
 groupIndex=0;
 startTurn();
}

function startTurn(){
 clearInterval(timer);
 currentGroup=activeGroups[groupIndex];
 if(!currentGroup){finishStage();return;}

 roundScore=0;
 time=60;
 passed=[];
 passedLife=new Set();
 used=new Set();
 cards=[...wordPool].sort(()=>Math.random()-.5).slice(0,3);
 cardIndex=0;

 document.getElementById("team").textContent=currentGroup.name;
 document.getElementById("round").textContent=roundNo+". TUR";
 document.getElementById("message").textContent="Kelimenin kendisini söylemek yasak!";
 show("game");
 update();
 showWord();

 timer=setInterval(()=>{
  time--;
  update();
  if(time<=0)finishTurn();
 },1000);
}

function update(){
 document.getElementById("lives").textContent=currentGroup.lives;
 document.getElementById("score").textContent=roundScore;
 document.getElementById("total").textContent=currentGroup.score+roundScore;
 document.getElementById("time").textContent=time;
}

function showWord(){
 if(cardIndex>=cards.length){
  if(passed.length){
   cards=passed;
   passed=[];
   cardIndex=0;
   document.getElementById("message").textContent=
   "Pas geçilen kelimelere tekrar dönüyoruz!";
  }else{
   finishTurn();
   return;
  }
 }
 document.getElementById("word").textContent=cards[cardIndex].word;
}

function correct(){
 if(!currentGroup||time<=0)return;
 const item=cards[cardIndex];
 if(!item)return;

 if(!used.has(item.word)){
  roundScore+=points[roundNo-1];
  used.add(item.word);
 }

 if(item.wasPassed && passedLife.has(item.word)){
  currentGroup.lives=Math.min(3,currentGroup.lives+1);
  passedLife.delete(item.word);
  document.getElementById("message").textContent=
  "Doğru! Kaybettiğiniz can geri geldi! ❤️";
 }else{
  document.getElementById("message").textContent="Doğru! +"+points[roundNo-1]+" puan 🎉";
 }

 cardIndex++;
 update();
 showWord();
}

function wrong(){
 if(!currentGroup||time<=0)return;
 currentGroup.lives--;
 document.getElementById("message").textContent="Yanlış! 1 can kaybettiniz.";
 cardIndex++;
 update();
 if(currentGroup.lives<=0){finishTurn();return;}
 showWord();
}

function passWord(){
 if(!currentGroup||time<=0)return;
 const item=cards[cardIndex];
 if(!item)return;

 currentGroup.lives--;
 item.wasPassed=true;
 passedLife.add(item.word);
 passed.push(item);

 document.getElementById("message").textContent=
 "Pas geçildi! 1 can kaybettiniz. Kelime sona bırakıldı.";
 cardIndex++;
 update();

 if(currentGroup.lives<=0){finishTurn();return;}
 showWord();
}

function finishTurn(){
 if(document.getElementById("game").classList.contains("hidden"))return;
 clearInterval(timer);

 currentGroup.score+=roundScore;
 currentGroup.rounds[roundNo-1]=roundScore;

 const maximum=points[roundNo-1]*3;
 const qualified=roundScore===maximum && currentGroup.lives>0;

 if(!qualified)currentGroup.eliminated=true;

 document.getElementById("resultTitle").textContent=
 roundNo+". TUR TAMAMLANDI";

 document.getElementById("resultScore").textContent=
 "Bu tur: "+roundScore+" / "+maximum+" puan";

 document.getElementById("resultInfo").textContent=
 qualified
 ? "Tebrikler! Sonraki tura geçmeye hak kazandınız. ❤️ Kalan can: "+currentGroup.lives
 : "Bu turda elendiniz. Toplam puanınız: "+currentGroup.score;

 const last=groupIndex===activeGroups.length-1;

 document.getElementById("nextGroup").classList.toggle("hidden",last);
 document.getElementById("finishStage").classList.toggle("hidden",!last);

 if(roundNo===3){
  document.getElementById("nextGroup").classList.add("hidden");
  document.getElementById("finishStage").classList.remove("hidden");
  document.getElementById("finishStage").textContent=
  "YARIŞMAYI BİTİR";
 }
 show("result");
}

function nextGroup(){
 groupIndex++;
 startTurn();
}

function finishStage(){
 clearInterval(timer);

 if(roundNo===3){
  showFinal();
  return;
 }

 const qualified=activeGroups.filter(g=>!g.eliminated);
 if(qualified.length===0){
  showFinal();
  return;
 }

 roundNo++;
 activeGroups=qualified;
 groupIndex=0;

 document.getElementById("resultInfo").textContent=
 "Yeni tur başlıyor! "+qualified.length+" grup yarışmaya devam ediyor.";
 startTurn();
}

function showFinal(){
 clearInterval(timer);
 const sorted=[...groups].sort((a,b)=>b.score-a.score);
 const winner=sorted[0];
 document.getElementById("champion").textContent=
 winner && winner.score>0 ? "🏆 Kazanan: "+winner.name : "Yarışma tamamlandı!";
 document.getElementById("ranking").innerHTML=
 "<table><tr><th>Sıra</th><th>Grup</th><th>Puan</th></tr>"+
 sorted.map((g,i)=>
 "<tr><td>"+(i+1)+"</td><td>"+escapeHTML(g.name)+
 "</td><td>"+g.score+"</td></tr>").join("")+"</table>";
 show("final");
}

function escapeHTML(s){
 return s.replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",
 '"':"&quot;","'":"&#39;"
 })[c]);
}
</script>
</body>
</html>
