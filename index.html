
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anlat Bakalım</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;padding:20px;
 background:linear-gradient(135deg,#10152d,#253d69);
 color:white;font-family:Arial;text-align:center;
}
.container{
 max-width:600px;margin:25px auto;padding:25px;
 background:#202c47;border-radius:20px;
 box-shadow:0 10px 30px #0008;
}
h1{color:#ffd43b}
input{
 width:90%;padding:15px;border:0;
 border-radius:10px;font-size:18px;margin:15px 0;
}
button{
 padding:14px 20px;margin:7px;border:0;
 border-radius:12px;font-size:16px;
 font-weight:bold;cursor:pointer;
 background:#ffd43b;
}
.hidden{display:none}
.info{
 background:#111a30;padding:15px;
 border-radius:12px;margin:12px 0;
}
#timer{font-size:42px;color:#ffd43b}
.word{
 background:#111a30;padding:35px 10px;
 border-radius:15px;margin:25px 0;
 font-size:38px;font-weight:bold;color:#ffd43b;
 min-height:110px;display:flex;
 align-items:center;justify-content:center;
}
.correct{background:#20b96b;color:white}
.pass{background:#e49a32;color:white}
.next{background:#2999ed;color:white}
li{
 list-style:none;background:#111a30;
 padding:13px;margin:8px;border-radius:10px;
}
</style>
</head>
<body>

<div class="container">
<h1>🏆 ANLAT BAKALIM</h1>

<div id="start">
<h2>Grup Adı</h2>
<input id="groupName" placeholder="Grup adını gir">
<br>
<button onclick="startGroup()">Başla</button>
</div>

<div id="game" class="hidden">
<h2 id="groupTitle"></h2>
<div class="info">
 <h3 id="roundTitle"></h3>
 Her kelime: <b id="pointValue"></b> puan
 <div id="timer">60</div>
 Kelime: <b id="wordCount">1</b> / 3
 <br>Toplam puan: <b id="score">0</b>
</div>

<div class="word" id="word"></div>

<button class="correct" onclick="correct()">✅ BİLDİ</button>
<button class="pass" onclick="skip()">⏭ PAS</button>
</div>

<div id="roundEnd" class="hidden">
<h2>🎉 TUR TAMAMLANDI!</h2>
<h2 id="roundResult"></h2>
<h1 id="roundScore"></h1>
<p id="roundMessage"></p>
<button class="next" id="nextButton" onclick="nextRound()">
2. TURA GEÇ
</button>
</div>

<div id="groupEnd" class="hidden">
<h1>🏆 GRUP TAMAMLANDI!</h1>
<h2 id="finishedGroup"></h2>
<h1 id="finishedScore"></h1>
<button onclick="showRanking()">Puan Tablosu</button>
<button onclick="newGroup()">Yeni Grup</button>
</div>

<div id="ranking" class="hidden">
<h2>🏆 SIRALAMA</h2>
<ol id="rankingList"></ol>
<button onclick="newGroup()">Yeni Grup</button>
</div>

</div>

<script>
const words=[
"DOLAP","PİRAMİT","BİSİKLET","TELEFON",
"UÇAK","DOKTOR","FUTBOL","BİLGİSAYAR",
"OKUL","DENİZ","KAMERA","ROBOT",
"ASLAN","KÖPEK","GÜNEŞ","AY",
"TELEVİZYON","KALEM","KÜTÜPHANE",
"YILDIZ","HELİKOPTER","ÇİKOLATA",
"ŞEMSİYE","BUZDOLABI","ÖĞRETMEN",
"ASTRONOT","TREN","GEMİ","KÖPRÜ",
"FIRIN","SAAT","GÖKKUŞAĞI","AYNA",
"ŞAPKA","PİYANO","KARPUZ","UÇURTMA",
"ÇANTA","BULUT","ASANSÖR"
];

const points=[10,20,30];
const roundNames=["1. TUR","2. TUR","3. TUR"];

let groups=[];
let currentGroup=null;
let round=0;
let wordIndex=0;
let score=0;
let time=60;
let timer=null;
let locked=false;
let currentWords=[];

function startGroup(){
 const name=document.getElementById("groupName").value.trim();
 if(!name){alert("Grup adını gir!");return;}

 currentGroup={
  name:name,
  scores:[0,0,0],
  total:0
 };

 groups.push(currentGroup);
 score=0;
 round=0;
 startRound();
}

function startRound(){
 wordIndex=0;
 time=60;
 locked=false;
 currentWords=[...words].sort(()=>Math.random()-.5).slice(0,3);

 document.getElementById("start").classList.add("hidden");
 document.getElementById("roundEnd").classList.add("hidden");
 document.getElementById("groupEnd").classList.add("hidden");
 document.getElementById("game").classList.remove("hidden");

 document.getElementById("groupTitle").textContent=currentGroup.name;
 document.getElementById("roundTitle").textContent=roundNames[round];
 document.getElementById("pointValue").textContent=points[round];
 showWord();
 startTimer();
}

function showWord(){
 document.getElementById("word").textContent=currentWords[wordIndex];
 document.getElementById("wordCount").textContent=wordIndex+1;
 document.getElementById("score").textContent=score;
}

function correct(){
 if(locked)return;
 score+=points[round];
 currentGroup.scores[round]+=points[round];
 wordIndex++;
 checkNext();
}

function skip(){
 if(locked)return;
 wordIndex++;
 checkNext();
}

function checkNext(){
 if(wordIndex>=3){
  finishRound();
 }else{
  showWord();
 }
}

function startTimer(){
 clearInterval(timer);
 timer=setInterval(()=>{
  time--;
  document.getElementById("timer").textContent=time;
  if(time<=0)finishRound();
 },1000);
}

function finishRound(){
 if(locked)return;
 locked=true;
 clearInterval(timer);

 document.getElementById("game").classList.add("hidden");

 if(round===2){
  currentGroup.total=currentGroup.scores.reduce((a,b)=>a+b,0);
  document.getElementById("groupEnd").classList.remove("hidden");
  document.getElementById("finishedGroup").textContent=currentGroup.name;
  document.getElementById("finishedScore").textContent=currentGroup.total+" PUAN";
 }else{
  document.getElementById("roundEnd").classList.remove("hidden");
  document.getElementById("roundResult").textContent=roundNames[round]+" BİTTİ";
  document.getElementById("roundScore").textContent=score+" PUAN";

  document.getElementById("nextButton").textContent=
  roundNames[round+1]+" GEÇ";

  document.getElementById("roundMessage").textContent=
  "Hazırsanız sonraki tura başlayabilirsiniz.";
 }
}

function nextRound(){
 round++;
 startRound();
}

function newGroup(){
 document.getElementById("groupEnd").classList.add("hidden");
 document.getElementById("ranking").classList.add("hidden");
 document.getElementById("start").classList.remove("hidden");
 document.getElementById("groupName").value="";
 document.getElementById("groupName").focus();
}

function showRanking(){
 document.getElementById("groupEnd").classList.add("hidden");
 document.getElementById("ranking").classList.remove("hidden");

 const sorted=[...groups].sort((a,b)=>b.total-a.total);
 const list=document.getElementById("rankingList");
 list.innerHTML="";

 sorted.forEach((g,i)=>{
  const li=document.createElement("li");
  li.textContent=(i+1)+". "+g.name+" — "+g.total+
   " puan (10 puanlık tur: "+g.scores[0]+
   ", 20 puanlık tur: "+g.scores[1]+
   ", 30 puanlık tur: "+g.scores[2]+")";
  list.appendChild(li);
 });
}
</script>
</body>
</html>
