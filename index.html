
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anlat Bakalım</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;padding:20px;
 background:linear-gradient(135deg,#10152d,#253d69);
 color:white;font-family:Arial;text-align:center;
}
.container{
 max-width:620px;margin:25px auto;padding:25px;
 background:#202c47;border-radius:20px;
 box-shadow:0 10px 30px #0008;
}
h1{color:#ffd43b}
input{
 width:90%;padding:15px;border:0;
 border-radius:10px;font-size:18px;margin:15px 0;
}
button{
 padding:14px 18px;margin:7px;border:0;
 border-radius:12px;font-size:16px;
 font-weight:bold;cursor:pointer;
 background:#ffd43b;
}
.hidden{display:none}
.info{
 background:#111a30;padding:15px;
 border-radius:12px;margin:12px 0;
}
#timer{font-size:42px;color:#ffd43b}
.word{
 background:#111a30;padding:35px 10px;
 border-radius:15px;margin:25px 0;
 font-size:38px;font-weight:bold;color:#ffd43b;
 min-height:110px;display:flex;
 align-items:center;justify-content:center;
}
.correct{background:#20b96b;color:white}
.pass{background:#e49a32;color:white}
.next{background:#2999ed;color:white}
li{
 list-style:none;background:#111a30;
 padding:13px;margin:8px;border-radius:10px;
}
</style>
</head>
<body>

<div class="container">
<h1>🏆 ANLAT BAKALIM</h1>

<div id="start">
<h2 id="startTitle">1. TUR - 1. GRUP</h2>
<p>Grup adını gir:</p>
<input id="groupName" placeholder="Grup adı">
<br>
<button onclick="startGroup()">Başla</button>
</div>

<div id="game" class="hidden">
<h2 id="groupTitle"></h2>
<div class="info">
<h3 id="roundTitle"></h3>
Kelime başına: <b id="pointValue"></b> puan
<div id="timer">60</div>
Kelime: <b id="wordCount">1</b> / 3
<br>Toplam puan: <b id="score">0</b>
</div>
<div class="word" id="word"></div>
<button class="correct" onclick="correct()">✅ BİLDİ</button>
<button class="pass" onclick="skip()">⏭ PAS</button>
</div>

<div id="groupResult" class="hidden">
<h2>🎉 GRUP TURU TAMAMLADI!</h2>
<h2 id="resultName"></h2>
<h1 id="resultScore"></h1>
<button class="next" onclick="nextGroup()">Sonraki Gruba Geç</button>
</div>

<div id="roundResult" class="hidden">
<h2>🏆 BÜTÜN GRUPLAR TAMAMLADI!</h2>
<h3 id="roundFinished"></h3>
<ol id="roundList"></ol>
<button class="correct" onclick="addGroup()">➕ YENİ GRUP OLUŞTUR</button>
<button class="next" onclick="nextRound()" id="nextRoundButton">2. TURA GEÇ</button>
<br>
<button onclick="showRanking()">Puan Tablosu</button>
</div>

<div id="ranking" class="hidden">
<h2>🏆 PUAN TABLOSU</h2>
<ol id="rankingList"></ol>
<button onclick="backToRound()">Geri Dön</button>
</div>

<div id="final" class="hidden">
<h1>🏆 YARIŞMA BİTTİ!</h1>
<h2 id="winner"></h2>
<ol id="finalList"></ol>
<button onclick="location.reload()">Yeni Yarışma</button>
</div>
</div>

<script>

// GENİŞ KELİME HAVUZU
const words = [
"AKVARYUM","ASANSÖR","ASTRONOT","AYNA","BALON",
"BAVUL","BAYKUŞ","BİSİKLET","BİLGİSAYAR","BULUT",
"BUZDOLABI","CAMBAZ","CÜZDAN","ÇADIR","ÇAPA",
"ÇİÇEK","ÇİKOLATA","ÇİZGİ FİLM","ÇORAP","DANS",
"DAVUL","DENİZALTI","DİŞ FIRÇASI","DOLAP","DONDURMA",
"DÜRÜBÜN","EJDERHA","ELDİVEN","ELEKTRİK","FENER",
"FIRÇA","FUTBOL","GEMİ","GÖKKUŞAĞI","GÖZLÜK",
"GÜNEŞ","HALI","HAMAK","HARİTA","HEYKEL",
"HELİKOPTER","HİNDİSTAN CEVİZİ","İNCİR","İSKAMBİL",
"JANDARMA","JETON","KAMERA","KANGURU","KARPUZ",
"KARTAL","KASK","KAYAK","KEMAN","KİLİT",
"KİTAPLIK","KOVBOY","KÖPRÜ","KÖSTEBEK","KÜTÜPHANE",
"LAMBA","LUNAPARK","MAKAS","MARANGOZ","MAYMUN",
"MERDİVEN","MİKROFON","MİKROSKOP","MUM","MÜZİK",
"NALBUR","NAR","NEŞTER","OKYANUS","ORKİDE",
"OYUNCAK","ÖRÜMCEK","PALYAÇO","PANDA","PAPATYA",
"PARAŞÜT","PATEN","PENGUEN","PİRAMİT","PİYANO",
"POSTACI","RADYO","ROBOT","ROKET","SALINCAK",
"SANDALYE","SATRANÇ","SİNCAP","SİRK","SÜPÜRGE",
"ŞEMSİYE","ŞELALE","TABLO","TAHTA","TAKSİ",
"TAMBUR","TARAK","TELESKOP","TELEVİZYON","TERMOS",
"TIRTIL","TİMSAH","TREN","TRAKTÖR","TULUM",
"UÇAK","UÇURTMA","UZAY","ÜTÜ","VETERİNER",
"VİNÇ","VİYOLONSEL","VOLKAN","YAKIT","YAPBOZ",
"YEL DEĞİRMENİ","YELKENLİ","YILDIZ","YUNUS",
"ZAMBAK","ZEBRA","ZİL","ZÜRAFA",
"ANAHTAR","ARMUT","AYAKKABI","BADEMCİK","BARDAK",
"BEŞİK","BİLEZİK","BOYUNBAĞI","ÇEKMECE","ÇEKİÇ",
"ÇAMAŞIR MAKİNESİ","ÇEKİRDEK","ÇINGIRAK","ÇİFTLİK",
"DÜRÜM","EKMEK","FİL","FİNCAN","FOK BALIGI",
"GALOŞ","GİTAR","GÜVERCİN","HAMSİ","KAHVE",
"KALORİFER","KARAVAN","KASAP","KAZAK","KEDİ",
"KUM SAATİ","KUMBARA","KURBAĞA","KÜREK","LİMON",
"MANDAL","MANGAL","MASKE","MATKAP","MAYO",
"MİNDER","MONT","MOTOR","MÜHENDİS","NAL",
"ODUN","PASTA","PİL","PİPET","PUSULA",
"RÖNTGEN","SABUN","SAAT","SANDIK","SÜT",
"ŞAPKA","ŞARJ ALETİ","ŞİŞE","TAVA","TENCERE",
"TOST MAKİNESİ","TURŞU","VANTİLATÖR","YASTIK",
"YAY","YEMEK MASASI","YOĞURT","ZIMBA"
];

const points=[10,20,30,40,50];
const totalRounds=5;

let groups=[];
let round=0;
let groupIndex=0;
let currentGroup=null;
let wordIndex=0;
let time=60;
let timer=null;
let locked=false;

// Daha önce kullanılan kelimeleri takip eder.
let usedWords=new Set();

function getNewWords(){
 let available=words.filter(w=>!usedWords.has(w));

 // Kelime havuzu tükenirse yeni bir havuz başlat.
 if(available.length<3){
  usedWords.clear();
  available=[...words];
 }

 available.sort(()=>Math.random()-.5);

 let selected=available.slice(0,3);

 selected.forEach(w=>usedWords.add(w));

 return selected;
}

function startGroup(){
 const name=document.getElementById("groupName").value.trim();

 if(!name){
  alert("Grup adını gir!");
  return;
 }

 if(groups.some(g=>g.name.toLocaleLowerCase("tr-TR")===name.toLocaleLowerCase("tr-TR"))){
  alert("Bu grup adı zaten var!");
  return;
 }

 groups.push({
  name:name,
  scores:[0,0,0,0,0],
  completed:[false,false,false,false,false]
 });

 groupIndex=groups.length-1;
 startGame();
}

function addGroup(){
 document.getElementById("roundResult").classList.add("hidden");
 document.getElementById("start").classList.remove("hidden");
 document.getElementById("startTitle").textContent=
 (round+1)+". TUR - YENİ GRUP";
 document.getElementById("groupName").value="";
}

function startGame(){
 currentGroup=groups[groupIndex];
 wordIndex=0;
 time=60;
 locked=false;

 currentWords=getNewWords();

 document.getElementById("start").classList.add("hidden");
 document.getElementById("groupResult").classList.add("hidden");
 document.getElementById("roundResult").classList.add("hidden");
 document.getElementById("game").classList.remove("hidden");

 document.getElementById("groupTitle").textContent="🎯 "+currentGroup.name;
 document.getElementById("roundTitle").textContent=(round+1)+". TUR";
 document.getElementById("pointValue").textContent=points[round];

 showWord();
 startTimer();
}

function showWord(){
 document.getElementById("word").textContent=currentWords[wordIndex];
 document.getElementById("wordCount").textContent=wordIndex+1;
 document.getElementById("score").textContent=getTotal(currentGroup);
}

function correct(){
 if(locked)return;
 currentGroup.scores[round]+=points[round];
 wordIndex++;
 checkNext();
}

function skip(){
 if(locked)return;
 wordIndex++;
 checkNext();
}

function checkNext(){
 if(wordIndex>=3){
  finishGroup();
 }else{
  showWord();
 }
}

function startTimer(){
 clearInterval(timer);
 document.getElementById("timer").textContent=time;

 timer=setInterval(()=>{
  time--;
  document.getElementById("timer").textContent=time;
  if(time<=0)finishGroup();
 },1000);
}

function finishGroup(){
 if(locked)return;
 locked=true;
 clearInterval(timer);

 currentGroup.completed[round]=true;

 document.getElementById("game").classList.add("hidden");
 document.getElementById("groupResult").classList.remove("hidden");
 document.getElementById("resultName").textContent=currentGroup.name;
 document.getElementById("resultScore").textContent=getTotal(currentGroup)+" PUAN";
}

function nextGroup(){
 document.getElementById("groupResult").classList.add("hidden");
 groupIndex++;

 if(groupIndex<groups.length){
  startGame();
 }else{
  showRoundResult();
 }
}

function showRoundResult(){
 document.getElementById("roundResult").classList.remove("hidden");
 document.getElementById("roundFinished").textContent=(round+1)+". TUR SONUÇLARI";

 const list=document.getElementById("roundList");
 list.innerHTML="";

 groups.forEach(g=>{
  const li=document.createElement("li");
  li.textContent=g.name+" — "+getTotal(g)+" puan";
  list.appendChild(li);
 });

 document.getElementById("nextRoundButton").textContent=
 round===totalRounds-1?"YARIŞMAYI BİTİR":(round+2)+". TURA GEÇ";
}

function nextRound(){
 if(round===totalRounds-1){
  finishCompetition();
  return;
 }

 round++;
 groupIndex=0;
 document.getElementById("roundResult").classList.add("hidden");
 startGame();
}

function getTotal(g){
 return g.scores.reduce((a,b)=>a+b,0);
}

function showRanking(){
 document.getElementById("roundResult").classList.add("hidden");
 document.getElementById("ranking").classList.remove("hidden");

 const sorted=[...groups].sort((a,b)=>getTotal(b)-getTotal(a));
 const list=document.getElementById("rankingList");
 list.innerHTML="";

 sorted.forEach((g,i)=>{
  const li=document.createElement("li");
  li.textContent=(i+1)+". "+g.name+" — "+getTotal(g)+" puan";
  list.appendChild(li);
 });
}

function backToRound(){
 document.getElementById("ranking").classList.add("hidden");
 showRoundResult();
}

function finishCompetition(){
 document.getElementById("roundResult").classList.add("hidden");
 document.getElementById("final").classList.remove("hidden");

 const sorted=[...groups].sort((a,b)=>getTotal(b)-getTotal(a));

 document.getElementById("winner").textContent="🥇 ŞAMPİYON: "+sorted[0].name;

 const list=document.getElementById("finalList");
 list.innerHTML="";

 sorted.forEach((g,i)=>{
  const li=document.createElement("li");
  li.textContent=(i+1)+". "+g.name+" — "+getTotal(g)+" puan";
  list.appendChild(li);
 });
}
</script>
</body>
</html>
