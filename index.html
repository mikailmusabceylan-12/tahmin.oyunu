

<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Türkçe Kelime Yarışması</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:linear-gradient(135deg,#101827,#253b60);
 color:white;
 min-height:100vh;
 padding:20px;
}
.container{max-width:850px;margin:auto}
h1{text-align:center;color:#ffd54a}
h2{text-align:center}
.card{
 background:#1e2b40;
 padding:22px;
 border-radius:16px;
 margin:15px 0;
 box-shadow:0 5px 20px #0005;
}
input{
 width:100%;padding:13px;margin:6px 0;
 border:0;border-radius:8px;font-size:16px;
}
button{
 border:0;border-radius:9px;padding:13px 18px;
 margin:5px;font-size:16px;font-weight:bold;
 cursor:pointer;
}
.primary{background:#ffd54a;color:#172033}
.correct{background:#24b76b;color:white}
.wrong{background:#e34c4c;color:white}
.pass{background:#e5a32c;color:#222}
.secondary{background:#607d9e;color:white}
button:disabled{opacity:.4;cursor:not-allowed}
.word{
 font-size:42px;text-align:center;
 color:#ffd54a;font-weight:bold;
 padding:35px 5px;
}
.score{
 display:flex;justify-content:space-between;
 border-bottom:1px solid #ffffff25;
 padding:12px 4px;gap:10px;
}
.hidden{display:none}
.info{text-align:center;color:#c9d6e8}
.badge{color:#ffd54a;font-weight:bold}
</style>
</head>
<body>
<div class="container">

<h1>🏆 TÜRKÇE KELİME YARIŞMASI</h1>

<div id="setup" class="card">
<h2>Yeni Grup Oluştur</h2>
<input id="groupName" placeholder="Grup adı">
<input id="player1" placeholder="1. yarışmacının adı">
<input id="player2" placeholder="2. yarışmacının adı">
<button class="primary" onclick="addGroup()">+ Grup Ekle</button>

<h3>Gruplar</h3>
<div id="groupList"></div>

<button class="primary" onclick="startGame()">YARIŞMAYI BAŞLAT</button>
</div>

<div id="game" class="hidden">

<div class="card">
<h2 id="roundTitle">1. TUR</h2>
<p class="info" id="roundInfo"></p>
<p class="info" id="groupInfo"></p>
<p class="info" id="playersInfo"></p>
<div class="word" id="word">KELİME</div>
<p class="info" id="wordInfo">Kelimeyi anlatan kişi bu kelimeyi tahmin ettirecek.</p>
<p class="info" id="progress"></p>

<div style="text-align:center">
<button class="correct" onclick="answer('correct')">✓ DOĞRU +10</button>
<button class="wrong" onclick="answer('wrong')">✕ YANLIŞ</button>
<button class="pass" onclick="answer('pass')">PAS</button>
</div>
</div>

<div class="card">
<h2>🏆 SKOR TABLOSU</h2>
<div id="scoreBoard"></div>
</div>

<div id="roundEnd" class="card hidden">
<h2 id="endTitle">Tur Tamamlandı!</h2>
<div id="endResults"></div>
<button class="primary" id="nextButton" onclick="nextRound()">SONRAKİ TURA GEÇ</button>
</div>

</div>

<div id="winner" class="card hidden">
<h1>🏆 YARIŞMA SONUÇLANDI!</h1>
<div id="winnerResults"></div>
<button class="primary" onclick="location.reload()">YENİ YARIŞMA</button>
</div>

</div>

<script>
const words = [
"Araba","Uçak","Bisiklet","Telefon","Bilgisayar",
"Kalem","Kitap","Masa","Sandalye","Kapı",
"Deniz","Orman","Dağ","Güneş","Ay",
"Kedi","Köpek","Aslan","Fil","Zürafa",
"Doktor","Öğretmen","Polis","Aşçı","Pilot",
"Futbol","Basketbol","Yüzme","Koşu","Bisiklet",
"Çikolata","Dondurma","Pizza","Hamburger","Pasta",
"Yağmur","Kar","Rüzgar","Gökkuşağı","Bulut",
"Okul","Hastane","Market","Sinema","Kütüphane",
"Televizyon","Saat","Gözlük","Ayakkabı","Şemsiye",
"Kaplumbağa","Kelebek","Penguen","Tavşan","Maymun",
"Tren","Gemi","Helikopter","Otobüs","Kamyon",
"Telefoncu","Berber","Bahçıvan","Mimar","Mühendis",
"Balon","Hediye","Ayna","Anahtar","Çanta",
"Yıldız","Gezegen","Uzay","Dünya","Roket",
"Patates","Domates","Salatalık","Karpuz","Çilek",
"Denizaltı","Köprü","Kale","Kule","Şato",
"Çamaşır","Buzdolabı","Fırın","Mikrodalga","Lamba"
];

let groups=[];
let activeGroups=[];
let round=1;
let groupIndex=0;
let wordIndex=0;
let currentWords=[];

function addGroup(){
 const name=document.getElementById("groupName").value.trim();
 const p1=document.getElementById("player1").value.trim();
 const p2=document.getElementById("player2").value.trim();

 if(!name||!p1||!p2){
  alert("Grup adı ve iki yarışmacı adı gir!");
  return;
 }

 if(groups.some(g=>g.name.toLowerCase()===name.toLowerCase())){
  alert("Bu grup adı zaten kullanılıyor!");
  return;
 }

 groups.push({
  name:name,
  p1:p1,
  p2:p2,
  score:0,
  eliminated:false
 });

 document.getElementById("groupName").value="";
 document.getElementById("player1").value="";
 document.getElementById("player2").value="";

 showGroups();
}

function showGroups(){
 document.getElementById("groupList").innerHTML=
 groups.map((g,i)=>`
 <div class="score">
 <span>${i+1}. ${g.name} (${g.p1} - ${g.p2})</span>
 <button class="wrong" onclick="removeGroup(${i})">Sil</button>
 </div>`).join("");
}

function removeGroup(i){
 groups.splice(i,1);
 showGroups();
}

function startGame(){
 if(groups.length<2){
  alert("Yarışma için en az 2 grup eklemelisin!");
  return;
 }

 activeGroups=groups.slice();
 document.getElementById("setup").classList.add("hidden");
 document.getElementById("game").classList.remove("hidden");

 beginRound();
}

function shuffleWords(){
 let arr=[...words];
 for(let i=arr.length-1;i>0;i--){
  let j=Math.floor(Math.random()*(i+1));
  [arr[i],arr[j]]=[arr[j],arr[i]];
 }
 return arr.slice(0,3);
}

function beginRound(){
 groupIndex=0;
 wordIndex=0;

 activeGroups.forEach(g=>{
  g.roundWords=shuffleWords();
 });

 document.getElementById("roundEnd").classList.add("hidden");
 showGroup();
}

function showGroup(){
 if(groupIndex>=activeGroups.length){
  finishRound();
  return;
 }

 const g=activeGroups[groupIndex];
 currentWords=g.roundWords;

 document.getElementById("roundTitle").textContent=round+". TUR";
 document.getElementById("roundInfo").textContent=
 "Her doğru cevap 10 puan. Bu turda 3 kelime var.";

 document.getElementById("groupInfo").textContent=
 "🎯 Sıra: "+g.name;

 document.getElementById("playersInfo").textContent=
 "Anlatan: "+g.p1+" | Tahmin eden: "+g.p2;

 showWord();
 updateScores();
}

function showWord(){
 const g=activeGroups[groupIndex];

 document.getElementById("word").textContent=
 currentWords[wordIndex];

 document.getElementById("progress").textContent=
 "Kelime "+(wordIndex+1)+" / 3";

 document.getElementById("wordInfo").textContent=
 g.p1+" kelimeyi anlatacak, "+g.p2+" tahmin edecek.";

}

function answer(type){
 const g=activeGroups[groupIndex];

 if(type==="correct"){
  g.score+=10;
 }

 wordIndex++;

 if(wordIndex>=3){
  groupIndex++;
  showGroup();
 }else{
  showWord();
  updateScores();
 }
}

function updateScores(){
 let sorted=[...groups].sort((a,b)=>b.score-a.score);

 document.getElementById("scoreBoard").innerHTML=
 sorted.map((g,i)=>`
 <div class="score">
 <span>${i+1}. ${g.name} ${g.eliminated?"❌ ELENDİ":""}</span>
 <strong>${g.score} PUAN</strong>
 </div>`).join("");
}

function finishRound(){
 const threshold=round*30;

 activeGroups.forEach(g=>{
  if(g.score<threshold){
   g.eliminated=true;
  }
 });

 activeGroups=activeGroups.filter(g=>!g.eliminated);

 document.getElementById("roundEnd").classList.remove("hidden");

 document.getElementById("endTitle").textContent=
 round+". TUR TAMAMLANDI!";

 let results=groups.map(g=>{
  let status=g.eliminated?"❌ ELENDİ":"✅ DEVAM EDİYOR";
  return `<div class="score">
  <span>${g.name} - ${status}</span>
  <strong>${g.score} puan</strong>
  </div>`;
 }).join("");

 document.getElementById("endResults").innerHTML=
 "<h3>Tur Sonuçları</h3>"+results;

 updateScores();

 const next=document.getElementById("nextButton");

 if(activeGroups.length===0){
  next.textContent="SONUÇLARI GÖR";
 }else if(round===3){
  next.textContent="YARIŞMAYI BİTİR";
 }else{
  next.textContent=(round+1)+". TURA GEÇ";
 }
}

function nextRound(){
 if(activeGroups.length===0||round===3){
  finishGame();
  return;
 }

 round++;
 beginRound();
}

function finishGame(){
 document.getElementById("game").classList.add("hidden");
 document.getElementById("winner").classList.remove("hidden");

 let winners=activeGroups.sort((a,b)=>b.score-a.score);

 if(winners.length===0){
  document.getElementById("winnerResults").innerHTML=
  "<h2>Üç tur sonunda kalan grup olmadı.</h2>";
 }else{
  document.getElementById("winnerResults").innerHTML=
  winners.map((g,i)=>`
  <div class="score">
  <span>${i===0?"🥇":i===1?"🥈":"🥉"} ${g.name}</span>
  <strong>${g.score} PUAN</strong>
  </div>`).join("");
 }
}
</script>
</body>
</html>
