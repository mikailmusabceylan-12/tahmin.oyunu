

<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kelime Yarışması</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;padding:20px;font-family:Arial;
 background:linear-gradient(135deg,#101827,#263e65);
 color:white;min-height:100vh
}
.container{max-width:850px;margin:auto}
h1{text-align:center;color:#ffd54a}
.card{
 background:#1d2c43;padding:22px;
 border-radius:16px;margin:15px 0;
 box-shadow:0 5px 20px #0005
}
input{
 width:100%;padding:14px;border:0;
 border-radius:9px;font-size:17px;margin:8px 0
}
button{
 padding:13px 18px;border:0;border-radius:9px;
 font-weight:bold;font-size:15px;margin:5px;cursor:pointer
}
.primary{background:#ffd54a;color:#172033}
.correct{background:#21b66b;color:white}
.wrong{background:#df4949;color:white}
.pass{background:#e8a52d;color:#222}
.secondary{background:#647e9e;color:white}
.word{
 font-size:45px;text-align:center;
 color:#ffd54a;padding:30px 0;font-weight:bold
}
.center{text-align:center}
.score{
 display:flex;justify-content:space-between;
 padding:12px 4px;border-bottom:1px solid #ffffff25
}
.info{text-align:center;color:#cbd8e9}
.hidden{display:none}
button:disabled{opacity:.4}
</style>
</head>
<body>
<div class="container">

<h1>🏆 KELİME YARIŞMASI</h1>

<div id="setup" class="card">
<h2>Yeni Grup</h2>
<input id="groupName" placeholder="Grup adını yaz...">
<button class="primary" onclick="addGroup()">GRUBU EKLE</button>
<div id="groupList"></div>
<p class="info">Grupları sırayla ekle. En az 2 grup gerekli.</p>
<button class="primary" onclick="startGame()">YARIŞMAYI BAŞLAT</button>
</div>

<div id="game" class="hidden">
<div class="card center">
<h2 id="roundTitle">1. TUR</h2>
<p id="groupInfo" class="info"></p>
<p id="progress" class="info"></p>
<div id="word" class="word">KELİME</div>
<p class="info">Kelimeyi söylemeden anlat ve tahmin ettir!</p>
<button class="correct" onclick="answer('correct')">DOĞRU +10</button>
<button class="wrong" onclick="answer('wrong')">YANLIŞ</button>
<button class="pass" onclick="answer('pass')">PAS</button>
</div>

<div id="nextGroupBox" class="card hidden">
<h2 class="center">Grup tamamlandı!</h2>
<p class="info" id="nextMessage"></p>
<input id="nextGroupName" placeholder="Sıradaki grubun adı">
<button class="primary" onclick="addNextGroup()">SIRADAKİ GRUBU BAŞLAT</button>
</div>

<div class="card">
<h2>🏆 SKOR TABLOSU</h2>
<div id="scoreBoard"></div>
</div>

<div id="roundEnd" class="card hidden">
<h2 class="center" id="endTitle"></h2>
<div id="endResults"></div>
<div class="center">
<button class="primary" onclick="nextRound()" id="nextRoundBtn">SONRAKİ TURA GEÇ</button>
</div>
</div>
</div>

<div id="winner" class="card hidden">
<h1>🏆 YARIŞMA BİTTİ!</h1>
<div id="winnerResults"></div>
<button class="primary" onclick="location.reload()">YENİ YARIŞMA</button>
</div>
</div>

<script>
const words=[
"Araba","Uçak","Bisiklet","Telefon","Bilgisayar",
"Kalem","Kitap","Masa","Sandalye","Kapı",
"Deniz","Orman","Dağ","Güneş","Ay",
"Kedi","Köpek","Aslan","Fil","Zürafa",
"Doktor","Öğretmen","Polis","Aşçı","Pilot",
"Futbol","Basketbol","Yüzme","Koşu","Çikolata",
"Dondurma","Pizza","Hamburger","Yağmur","Kar",
"Rüzgar","Gökkuşağı","Bulut","Okul","Hastane",
"Market","Sinema","Kütüphane","Televizyon","Saat",
"Gözlük","Ayakkabı","Şemsiye","Kaplumbağa","Kelebek",
"Penguen","Tavşan","Maymun","Tren","Gemi",
"Helikopter","Otobüs","Kamyon","Balon","Hediye",
"Ayna","Anahtar","Çanta","Yıldız","Gezegen",
"Uzay","Dünya","Roket","Patates","Domates",
"Karpuz","Çilek","Köprü","Kale","Kule",
"Şato","Buzdolabı","Fırın","Lamba","Bahçıvan",
"Mimar","Mühendis","Balık","Timsah","Asansör",
"Uçurtma","Robot","Makas","Yastık","Battaniye"
];

let groups=[];
let round=1;
let currentGroup=0;
let wordIndex=0;
let roundGroups=[];
let usedWords=[];

function makeWords(){
 let available=words.filter(w=>!usedWords.includes(w));
 if(available.length<3){
  usedWords=[];
  available=[...words];
 }
 for(let i=available.length-1;i>0;i--){
  let j=Math.floor(Math.random()*(i+1));
  [available[i],available[j]]=[available[j],available[i]];
 }
 let selected=available.slice(0,3);
 usedWords.push(...selected);
 return selected;
}

function addGroup(){
 let name=document.getElementById("groupName").value.trim();
 if(!name){alert("Grup adı yaz!");return}
 if(groups.some(g=>g.name.toLowerCase()===name.toLowerCase())){
  alert("Bu grup zaten var!");return;
 }
 groups.push({name,score:0,eliminated:false});
 document.getElementById("groupName").value="";
 showSetupGroups();
}

function showSetupGroups(){
 document.getElementById("groupList").innerHTML=
 groups.map((g,i)=>`
 <div class="score">
 <span>${i+1}. ${g.name}</span>
 <button class="wrong" onclick="removeGroup(${i})">Sil</button>
 </div>`).join("");
}

function removeGroup(i){
 groups.splice(i,1);
 showSetupGroups();
}

function startGame(){
 if(groups.length<2){alert("En az 2 grup eklemelisin!");return}
 document.getElementById("setup").classList.add("hidden");
 document.getElementById("game").classList.remove("hidden");
 roundGroups=groups.slice();
 currentGroup=0;
 startGroup();
}

function startGroup(){
 wordIndex=0;
 const g=roundGroups[currentGroup];
 g.roundWords=makeWords();
 document.getElementById("nextGroupBox").classList.add("hidden");
 document.getElementById("roundEnd").classList.add("hidden");
 document.getElementById("roundTitle").textContent=round+". TUR";
 document.getElementById("groupInfo").textContent="🎯 ŞİMDİ YARIŞAN: "+g.name;
 showWord();
 updateScores();
}

function showWord(){
 const g=roundGroups[currentGroup];
 document.getElementById("word").textContent=g.roundWords[wordIndex];
 document.getElementById("progress").textContent=
 "Kelime "+(wordIndex+1)+" / 3";
}

function answer(type){
 const g=roundGroups[currentGroup];
 if(type==="correct")g.score+=10;
 wordIndex++;
 if(wordIndex<3){
  showWord();
  updateScores();
 }else{
  updateScores();
  document.getElementById("word").textContent="TAMAMLANDI!";
  document.getElementById("progress").textContent=
  g.name+" grubunun 3 kelimesi bitti.";
  document.getElementById("nextMessage").textContent=
  g.name+" grubunun puanı: "+g.score;
  document.getElementById("nextGroupBox").classList.remove("hidden");
 }
}

function addNextGroup(){
 let name=document.getElementById("nextGroupName").value.trim();
 if(!name){alert("Sıradaki grup adını yaz!");return}
 if(groups.some(g=>g.name.toLowerCase()===name.toLowerCase())){
  alert("Bu grup adı zaten kullanılıyor!");return
 }
 let g={name,score:0,eliminated:false};
 groups.push(g);
 roundGroups.push(g);
 document.getElementById("nextGroupName").value="";
 currentGroup++;
 startGroup();
}

function updateScores(){
 document.getElementById("scoreBoard").innerHTML=
 [...groups].sort((a,b)=>b.score-a.score).map((g,i)=>`
 <div class="score">
 <span>${i+1}. ${g.name} ${g.eliminated?"❌ ELENDİ":""}</span>
 <b>${g.score} PUAN</b>
 </div>`).join("");
}

function finishRound(){
 let limit=round*30;
 groups.forEach(g=>{
  if(!g.eliminated && g.score<limit)g.eliminated=true;
 });
 let survivors=groups.filter(g=>!g.eliminated);
 roundGroups=survivors;
 document.getElementById("nextGroupBox").classList.add("hidden");
 document.getElementById("roundEnd").classList.remove("hidden");
 document.getElementById("endTitle").textContent=round+". TUR SONUÇLARI";
 document.getElementById("endResults").innerHTML=
 groups.map(g=>`
 <div class="score">
 <span>${g.name} ${g.eliminated?"❌ ELENDİ":"✅ DEVAM"}</span>
 <b>${g.score} PUAN</b>
 </div>`).join("");
 updateScores();
 document.getElementById("nextRoundBtn").textContent=
 survivors.length===0?"SONUÇLARI GÖR":
 round===3?"YARIŞMAYI BİTİR":"SONRAKİ TURA GEÇ";
}

function nextRound(){
 if(roundGroups.length===0 || round===3){
  finishGame();return;
 }
 round++;
 currentGroup=0;
 roundGroups.forEach(g=>g.roundWords=makeWords());
 startGroup();
}

function finishGame(){
 document.getElementById("game").classList.add("hidden");
 document.getElementById("winner").classList.remove("hidden");
 let winners=roundGroups.slice().sort((a,b)=>b.score-a.score);
 document.getElementById("winnerResults").innerHTML=
 winners.length?winners.map((g,i)=>`
 <div class="score">
 <span>${i===0?"🥇":i===1?"🥈":"🥉"} ${g.name}</span>
 <b>${g.score} PUAN</b>
 </div>`).join(""):"Üç tur sonunda kalan grup olmadı.";
}
</script>
</body>
</html>
